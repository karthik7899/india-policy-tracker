<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>India Policy Tracker</title>
<link rel="stylesheet" href="styles.css">
<!-- Chart.js from CDN. Absent, every view falls back to its table, which is
     rendered underneath each chart anyway rather than instead of it. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>

<header class="app-head">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4.5"/>
        <line x1="8" y1="16.5" x2="8" y2="12.5"/><line x1="12" y1="16.5" x2="12" y2="7.5"/>
        <line x1="16" y1="16.5" x2="16" y2="10.5"/></svg>
    </span>
    <span class="brand-name">India Policy Tracker</span>
  </div>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme">◐</button>
</header>

<div id="nav"></div>

<main id="view" class="view" tabindex="-1">
  <p class="loading">Loading…</p>
</main>

<footer class="app-foot">
  <span>Generated by an automated pipeline. Figures are as published by the
    sources named; absence of a figure means it could not be read, not zero.</span>
</footer>

<script>
  // Theme toggle, inline and tiny so it applies before the module graph loads
  // and the page never flashes the wrong surface.
  (function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) { /* private mode */ }
    if (saved) root.dataset.theme = saved;
    document.addEventListener("click", function (e) {
      if (!e.target.closest("#theme-toggle")) return;
      var next = root.dataset.theme === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e2) { /* ignore */ }
      // Charts read their tokens at construction, so re-render on a swap.
      window.dispatchEvent(new HashChangeEvent("hashchange"));
    });
  })();
</script>

<script type="module" src="src/main.js"></script>
</body>
</html>
