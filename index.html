<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>India Policy Tracker</title>
<script>
  // Applied before the bundle parses, so the page never flashes the wrong
  // surface. Wrapped because a browser with site data blocked throws here.
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<div id="app"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
