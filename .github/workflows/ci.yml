name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs, so a change can be re-checked without pushing a commit.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read # the PR's labels, for the reader comparison below
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A PR is checked out as its merge commit; the second commit is the
          # base it merges into, which the reader comparison below needs.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black pytest pytest-anyio

      - name: Lint and Format
        run: |
          black --check .
          flake8 .

      - name: Run tests
        run: python -m pytest tests/

      # The readers' scores on their recorded answers, row by row against the
      # base the PR merges into (scripts/reader_eval.py). A holdout score that
      # falls fails here unless the PR carries the accept-regression label;
      # the labels are read when the job runs, so adding one and re-running
      # the job is enough.
      - name: Compare reader scores with the base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          allow=""
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -qx accept-regression; then
            allow="--allow-regression"
          fi
          python scripts/reader_eval.py --compare HEAD^1 $allow --summary "$GITHUB_STEP_SUMMARY"

      # The frontend had two jest files that CI never ran — they sat green by
      # never executing. Node's built-in runner needs no dependency, which
      # suits a repo that deliberately has no build step.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frontend tests
        run: npm test
