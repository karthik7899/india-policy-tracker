name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black pytest pytest-anyio

      - name: Lint and Format
        run: |
          black --check .
          flake8 .

      - name: Run tests
        run: python -m pytest tests/

      # The frontend had two jest files that CI never ran — they sat green by
      # never executing. Tests use node's built-in runner; the build is Vite.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      # A build that only breaks at deploy time breaks in front of the user.
      - name: Build
        run: npm run build
