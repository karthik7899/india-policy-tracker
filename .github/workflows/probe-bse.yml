name: Probe BSE endpoint catalogue

# Manual only. This is a diagnostic, not part of any briefing: it writes
# nothing, commits nothing, and sends no mail. It exists because BSE is
# unreachable from the development sandbox (403 on CONNECT, the same egress
# policy that blocks Screener and Yahoo), so the only way to establish what
# their endpoints actually return is to ask from a runner that can reach them.
#
# Deliberately SEPARATE from probe.yml. That workflow asks one source one
# question and makes one request; this one sweeps many endpoints to rebuild
# the catalogue in docs/upstream-findings.md. Merging them would either turn
# the sweep into a probe or the probe into a sweep, and the two want different
# blast radii.
#
# Read the job log for the answer; there is no artifact to collect.
#
# The three jobs that used to live here are gone, each for its own reason,
# recorded in docs/upstream-findings.md:
#   * nse-announcements  -> now `probe.yml --source nse-announcements`
#   * screener-pledge    -> answered; Screener serves no pledge row for anybody
#   * network (Playwright) -> answered; Akamai refuses headless Chromium, and
#                             defeating that means evasion tooling we will not
#                             build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Probe
        run: python scripts/probe_bse.py
