name: Deploy dashboard to Pages

# The dashboard is now built (Vite + Preact), so Pages can no longer serve the
# branch directly. Building here rather than committing dist/ keeps built
# assets out of git entirely, which matters because the daily pipeline commits
# data files to this same branch every morning — a committed bundle would have
# to stay in lockstep with those bot commits or the site would break silently.
#
# THREE TRIGGERS, and the middle one is not optional:
#
#   push               a code change to main
#   workflow_run       the daily briefing finishing
#   workflow_dispatch  a manual redeploy
#
# The daily job commits with "[skip ci]", which skips EVERY workflow on that
# push. With only `on: push`, the 07:30 data update would never redeploy and
# the site would serve yesterday's numbers forever while looking healthy. The
# workflow_run trigger fires on the briefing completing instead, which is not
# subject to [skip ci].

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_run:
    workflows: ["Scheduled India Policy Briefing"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, but do not cancel one in flight: the loser would
# leave Pages serving a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_run starts from the SHA that triggered the briefing, not
          # the commit the briefing itself pushed. Checking out the branch head
          # is what picks up the data the run just wrote.
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy the data the page fetches at runtime
        # These are written by the pipeline and committed to the repo; the
        # build does not produce them, so they are copied in beside the bundle.
        # Missing ones are not an error: a fresh clone has no sidecars yet, and
        # the views render "not available" rather than breaking.
        run: |
          set -eu
          for f in dashboard_data.json entity_graph.json watchlist.json; do
            [ -f "$f" ] && cp "$f" dist/ || echo "no $f, skipping"
          done
          for d in data news; do
            [ -d "$d" ] && cp -r "$d" dist/ || echo "no $d/, skipping"
          done
          echo "--- deploying:"
          find dist -maxdepth 1 -mindepth 1 | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
