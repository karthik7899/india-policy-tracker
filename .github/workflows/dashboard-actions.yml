name: Dashboard requests

# The dashboard is a static page on a public site, so a decision made there
# (accept a partner, move a holding, confirm a label) travels as an issue the
# owner submits under their own login, and this applies it
# (scripts/dashboard_actions.py). A question asked there arrives the same way
# and is answered as a comment; a comment the owner adds to a question's issue
# afterwards is a follow-up, answered the same way.
#
# Anyone can open an issue or comment on a public repository, and these jobs
# hold a token that can write to it. So they run only for the owner's issues
# and comments, and the body is read from the event file by Python, never
# placed into a shell command.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  act:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.author_association == 'OWNER' &&
      contains(github.event.issue.body, '<!-- tracker:')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write # commit the applied decisions
      issues: write # reply on the issue and close it
      actions: read # see whether the daily briefing is running
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply the request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Questions only: decisions never call the model.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
        run: python scripts/dashboard_actions.py "$GITHUB_EVENT_PATH"

  follow-up:
    # A comment on an issue the question workflow labelled. Answering commits
    # nothing, so this job cannot write to the repository's files. One run per
    # issue at a time, so a follow-up sees the answer to the one before it.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.author_association == 'OWNER' &&
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'dashboard-question')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ask-follow-up-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write # read the exchange and post the answer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Answer the follow-up
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
        run: python scripts/dashboard_actions.py "$GITHUB_EVENT_PATH"
