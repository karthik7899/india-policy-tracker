name: Dashboard requests

# The dashboard is a static page on a public site, so a decision made there
# (accept a partner, move a holding, confirm a label) travels as an issue the
# owner submits under their own login, and this applies it
# (scripts/dashboard_actions.py).
#
# Anyone can open an issue on a public repository, and this job holds a token
# that can write to it. So it runs only for the owner's issues, and the body
# is read from the event file by Python, never placed into a shell command.

on:
  issues:
    types: [opened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  act:
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      contains(github.event.issue.body, '<!-- tracker:')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write # commit the applied decisions
      issues: write # reply on the issue and close it
      actions: read # see whether the daily briefing is running
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply the request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/dashboard_actions.py "$GITHUB_EVENT_PATH"
