name: Scheduled India Policy Briefing

on:
  schedule:
    # Run daily at 02:30 AM UTC (08:00 AM IST)
    - cron: '30 2 * * *'
    # Run weekly briefing on Saturdays at 03:30 AM UTC (09:00 AM IST)
    - cron: '30 3 * * 6'
  workflow_dispatch: # Allows manual trigger of the briefing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One briefing at a time. Each starts from the state the last one pushed to
# data-state, and two at once would start from the same one: the second push
# is refused (scripts/state.py) rather than throw the first run's work away.
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  # Quality checks run alongside the briefing but deliberately do NOT block
  # it: a formatting nit must never stop the daily email (it did once, for
  # three days). Failures still surface as a red X on the run.
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black pytest pytest-anyio

      - name: Lint and Format
        run: |
          black --check .
          flake8 .

      # Two tests check the saved LLM caches against the code's event types
      # and stances; the caches live on the data-state branch.
      - name: Bring in the saved state
        run: python scripts/state.py pull

      - name: Run tests
        run: python -m pytest tests/

  run-briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write # main's watchlist and graph, and the data-state branch
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      # The daily cron fires every day including weekends/holidays, when NSE
      # never opened and prices can't have moved — that run just resends
      # yesterday's briefing. The weekly Saturday digest and manual dispatch
      # runs are intentional regardless of trading-day status, so they
      # bypass this gate. See market_calendar.py for the holiday list.
      - name: Check market calendar
        id: gate
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          import zoneinfo

          from market_calendar import is_trading_day

          event_name = os.environ.get("GH_EVENT_NAME", "")
          schedule = os.environ.get("GH_EVENT_SCHEDULE", "")
          today_ist = datetime.datetime.now(zoneinfo.ZoneInfo("Asia/Kolkata")).date()

          if event_name == "workflow_dispatch":
              should_run, reason = True, "manual dispatch"
          elif schedule == "30 3 * * 6":
              should_run, reason = True, "weekly Saturday digest always sends"
          else:
              should_run = is_trading_day(today_ist)
              reason = f"daily cron, {today_ist} is_trading_day={should_run}"

          print(f"::notice::Market calendar gate: {reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")
          PY

      # The corpus, the payload and its sidecars, and the LLM caches, as the
      # last run left them on the data-state branch (scripts/state.py).
      - name: Bring in the saved state
        if: steps.gate.outputs.should_run == 'true'
        run: python scripts/state.py pull

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Aggregation & Mailer Script
        if: steps.gate.outputs.should_run == 'true'
        env:
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Optional second reader for market events. Unset = rules only.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Optional comma-separated models to fall back to, in order.
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
        run: |
          python main.py

      # How the rules and the LLM reader score against the eval/ label sets,
      # from cached readings — except the thesis labels, read once (see
      # below). A readout, never a gate.
      - name: Score event readers
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
        run: |
          python scripts/eval_events.py --reader all
          python scripts/eval_events.py --reader policy
          # --live: reads each labelled pair once (bounded by the label
          # count, cached after), so the thesis check has a score from its
          # first run rather than only when a contradiction happens in the news.
          python scripts/eval_events.py --reader thesis --live

      # data-state holds one commit, the latest state, so an earlier one is
      # kept here: to roll back a bad run, unpack this into the repository
      # and run `python scripts/state.py push`.
      - name: Keep this run's state for 14 days
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ github.run_number }}
          path: |
            history.json
            dashboard_data.json
            llm_cache.json
            thesis_cache.json
            data/
            news/
          retention-days: 14
          if-no-files-found: error

      # Implicitly also requires success(), so a failed or degraded run never
      # overwrites the saved state, watchlist or graph with partial data.
      - name: Commit and Push Updated Dashboard Data
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The state goes to data-state, replacing the last run's; it is
          # ignored on main (scripts/state.py, .gitignore).
          python scripts/state.py push
          # What stays on main: the files people edit or review. Anything the
          # run rewrites that is tracked and not on this list would make
          # git pull --rebase refuse to run, so the commit below would be made
          # and never pushed; the check after this names it instead.
          git add watchlist.json rotation_ledger.json isin_master.json entity_graph.json entity_graph_proposals.json

          # Anything the run rewrote that is not on that list would fail the
          # rebase two steps down with "cannot pull with rebase", which says
          # nothing about the cause. Name it here instead.
          leftover=$(git diff --name-only)
          if [ -n "$leftover" ]; then
            echo "::error::Tracked files were modified but are not in the git add list above:"
            echo "$leftover"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update daily briefing archive and watchlist database [skip ci]"
            # Rebase in case another run pushed first; a real push failure
            # must fail the job, not be swallowed.
            git pull --rebase origin main
            git push
          fi

      # Runs only when something above failed. alerts.py is standard-library
      # only and always exits 0, so a broken mailbox cannot mask the real
      # failure the job is reporting.
      - name: Alert on failed run
        if: failure()
        env:
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_SHA: ${{ github.sha }}
        run: python alerts.py

  # The site is main's files plus the state just pushed (pages.yml). Called
  # rather than triggered: this run's pushes use the workflow token, and a
  # push made with it starts no workflow.
  publish:
    needs: run-briefing
    if: needs.run-briefing.outputs.should_run == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
